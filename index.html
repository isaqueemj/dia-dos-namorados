<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<!-- ✅ EVITA ZOOM AUTOMÁTICO -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>❤️ Surpresa ❤️</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="login">
    <h1>💖 Uma surpresa especial 💖</h1>

    <!-- ✅ INPUT NUMÉRICO -->
    <input 
        type="tel"
        inputmode="numeric"
        pattern="[0-9]*"
        id="senha"
        placeholder="Digite a senha"
    >

    <p>💖💖💖 Dica: A senha é uma data importante 💖💖💖</p>

    <button onclick="entrar()">Entrar</button>

    <p id="erro"></p>
</div>

<!-- SITE -->
<div id="site" class="hidden">

    <div class="bg"></div>

    <!-- CARTA -->
    <div class="container">
        <div class="carta" id="carta">

            <h2 id="titulo"></h2>

            <button onclick="abrir()">Abrir 💌</button>

            <p>
                Desde que você entrou na minha vida,
                tudo ficou mais bonito ❤️
            </p>

            <div id="mensagem"></div>

        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
